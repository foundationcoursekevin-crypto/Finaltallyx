name: Publish Tally website
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Find the website files (the folder with index.html)
        run: |
          i=$(find . -name index.html -not -path './node_modules/*' -not -path './.git/*' -not -path './_site/*' | head -1)
          if [ -z "$i" ]; then echo "No index.html found in the repository"; exit 1; fi
          d=$(dirname "$i")
          mkdir -p _site
          (cd "$d" && tar --exclude=./_site --exclude=./.git -cf - .) | tar -xf - -C _site
          ls _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
